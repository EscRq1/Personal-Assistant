<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assistant</title>

    <meta http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            connect-src 'self' http://localhost:5000;
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' blob: data: http://localhost:5000;
        ">

    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="stylesheet" href="./assets/katex.min.css">

    <style>
        .code, .auto, .assistant {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .code:hover, .auto:hover, .assistant:hover {
            background-color: rgba(199, 199, 199, 0.719);
        }
    </style>
</head>
<body>
    

    <div class="container" id="gc">
        <section class="header">
            <p class="summary" id="sum-header">New chat</p>

        </section>
        <section class="content">
            <section class="filler">
                <div id="chat-menu" class="chat-menu">
                    <button class="menu-item" id="rename-btn">Rename</button>

                    <button class="menu-item" id="pin-btn">Pin chat</button>

                    <button class="menu-item danger" style="color: brown;" id="del-btn">Delete</button>
                </div>
            </section>


            <section class="sub-content">
                <div class="output"></div>
                <div class="input-cont">
                    <div class="attachment-tray" id="attachment-tray"></div>
                    <textarea class="input" id="ai-input" placeholder="Ask assistant" rows="1"></textarea>
                    
                    <div style="grid-area: filler; display: flex; align-items: center;">
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <button class="i-btn" id="img-btn">+Image</button>
                    <input type="file" id="img-input" accept="image/*" multiple style="display:none" />
                    <div style="grid-area: abort-btn; display: flex; justify-content: center; align-items: center;">
                        <button class="control-btn" id="control-btn"><img id="control-img" src="./assets/arrow-right-long-solid-full.svg" style="height: 18px; width: 18px;"></i></button>
                    </div>
                </div>
           
            </section>
        </section>
        <section class="sidebar">
            <button class="col-btn" id="btn" >
                <img src="./assets/bars-solid-full.svg" style="height: 20px;"></i>


            </button>
            <button class="new-btn" id="btn">
                <img src="./assets/plus-solid-full.svg" style="height: 20px;"></i>


            </button>

            <section class="sb-container">
                
                
            </section>



        </section>





    </div>
<script src="./index.js"></script>

</body>
</html>
