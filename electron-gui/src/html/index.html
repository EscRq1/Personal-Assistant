<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Assistant</title>

    <meta http-equiv="Content-Security-Policy"
        content="
            default-src 'self';
            connect-src 'self' http://localhost:5000;
            script-src 'self' 'unsafe-inline';
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
            font-src 'self' https://fonts.gstatic.com;
            img-src 'self' blob: data: http://localhost:5000;
        ">

    <link rel="stylesheet" type="text/css" href="../styles/style.css">
    <link rel="stylesheet" href="../../assets/katex.min.css">

    <style>
        .code, .auto, .assistant {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .code:hover, .auto:hover, .assistant:hover {
            background-color: rgba(199, 199, 199, 0.719);
        }
    </style>
</head>
<body>
    

    <div class="container" id="gc">
        <section class="header">
            <p class="summary" id="sum-header">New chat</p>

            <div class="header-menu-wrap">
                <button class="header-menu-btn" id="header-menu-btn"
                        aria-label="App menu" aria-haspopup="true" aria-expanded="false">
                    <!-- reuses an asset you already ship -->
                    <img src="../../assets/ellipsis-vertical-solid-full.svg" alt="">
                </button>

                <div class="header-menu" id="header-menu" aria-label="App menu">
                    <div class="header-menu-section">
                        <p class="header-menu-label">Assistant:</p>
                        <span class="select-container" style="--snippet:'Choose thinking mode'">
                            <select class="header-menu-select" id="hm-assist-1" aria-label="Assistant mode">
                                <option value="low" selected>Flash</option>
                                <option value="medium">Thinking</option>
                                <option value="high">Deep</option>
                            </select>
                        </span>
                        <span class="select-container" style="--snippet:'Set thinking budget'">
                            <select class="header-menu-select" id="hm-assist-2" aria-label="Assistant thinking budget">
                                <option value="1024" selected>1024</option>
                                <option value="4096">4096</option>
                                <option value="-1">Unlimited</option>
                            </select>
                        </span>
                    </div>

                    <div class="header-menu-sep"></div>

                    <div class="header-menu-section">
                        <p class="header-menu-label">Coder:</p>
                        <span class="select-container" style="--snippet:'Choose thinking mode'">
                            <select class="header-menu-select" id="hm-coder-1" aria-label="Coder mode" style="margin-left: 18px;">
                                <option value="low">Flash</option>
                                <option value="medium" selected>Thinking</option>
                                <option value="xhigh">Deep</option>
                            </select>
                        </span>
                        <span class="select-container" style="--snippet:'Set thinking budget'">
                            <select class="header-menu-select" id="hm-coder-2" aria-label="Coder thinking budget">
                                <option value="1024">1024</option>
                                <option value="4096" selected>4096</option>
                                <option value="-1">Unlimited</option>
                            </select>
                        </span>
                    </div>
                </div>
            </div>
        </section>

        <section class="content">
            <section class="filler">
                <div id="chat-menu" class="chat-menu">
                    <button class="menu-item" id="rename-btn">Rename</button>

                    <button class="menu-item" id="pin-btn">Pin chat</button>

                    <button class="menu-item danger" style="color: brown;" id="del-btn">Delete</button>
                </div>
            </section>


            <section class="sub-content">
                <div class="output"></div>
                <div class="input-cont">
                    <div class="attachment-tray" id="attachment-tray"></div>
                    <textarea class="input" id="ai-input" placeholder="Ask assistant" rows="1"></textarea>
                    
                    <div style="grid-area: filler; display: flex; align-items: center;">
                        <label class="switch">
                            <input type="checkbox">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <button class="i-btn" id="img-btn">+Image</button>
                    <input type="file" id="img-input" accept="image/*" multiple style="display:none" />
                    <div style="grid-area: abort-btn; display: flex; justify-content: center; align-items: center;">
                        <button class="control-btn" id="control-btn"><img id="control-img" src="../../assets/arrow-right-long-solid-full.svg" style="height: 18px; width: 18px;"></i></button>
                    </div>
                </div>
           
            </section>
        </section>
        <section class="sidebar">
            <button class="col-btn" id="btn" >
                <img src="../../assets/bars-solid-full.svg" style="height: 20px;"></i>


            </button>
            <button class="new-btn" id="btn">
                <img src="../../assets/plus-solid-full.svg" style="height: 20px;"></i>


            </button>

            <section class="sb-container">
                
                
            </section>



        </section>





    </div>
<script src="../javascript/index.js"></script>

</body>
</html>
